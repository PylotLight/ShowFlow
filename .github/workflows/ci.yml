name: CI

# Lightweight PR check: install, test, build. Runs on GitHub-hosted
# ubuntu-latest (public repo, so minutes are free). Opt in to other runners
# (e.g. the NAS k3s ARC scale set) with the repo variable RUNNER_LABELS: a
# label like `k3s-runners-showflow` or a JSON array of labels. Nothing here
# needs docker.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fork PRs always go to ubuntu-latest even if RUNNER_LABELS points at
  # self-hosted runners: untrusted PR code never lands on the NAS.
  test-and-build:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || (startsWith(vars.RUNNER_LABELS, '[') && fromJSON(vars.RUNNER_LABELS)) || vars.RUNNER_LABELS || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # No actions/cache: a cold `bun install` is ~5s, while saving the ~190MB
      # cache cost far more, and PR-branch caches aren't visible to other PRs
      # so most runs missed anyway. Same as the release workflow.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun check

      - name: Build
        run: bun run build.ts
