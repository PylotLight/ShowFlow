name: Build & Push Docker Image

on:
  # Push builds disabled: nothing consumes per-merge images (updates ship
  # via the release tarball), so every main push was a wasted ~1.5min run.
  # Releases are the sole build trigger.
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.docker_build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GITHUB_SHA=${{ github.sha }}
            GITHUB_REF_NAME=${{ github.ref_name }}
            SUPERVISOR_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # On every published GitHub Release, package the already-built release
  # files (binary + manifest + migrations, all baked into the image above)
  # into the standalone tarball (showflow-<sha>.tar.gz) and upload it.
  # Extracting from the image skips a second checkout + bun install +
  # compile on a fresh runner (~1-2min) and guarantees the tarball bytes
  # are identical to what's in the image.
  publish-release-assets:
    needs: build-and-push
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release files from image
        run: |
          IMG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}
          docker pull "$IMG"
          docker create --name release-files "$IMG"
          docker cp release-files:/bootstrap/showflow ./showflow
          docker cp release-files:/bootstrap/manifest.json ./manifest.json
          docker cp release-files:/bootstrap/migrations ./migrations
          docker rm release-files

      - name: Package release assets
        run: tar -czf showflow-${{ github.sha }}.tar.gz -C "$PWD" showflow manifest.json migrations

      - name: Upload release asset
        run: gh release upload ${{ github.ref_name }} showflow-${{ github.sha }}.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
