name: Release

# Cut a release from GitHub (Actions tab / mobile app) without a local `gh`:
# runs the same release.ts as `bun run release` (bump package.json, commit
# "[skip ci]", tag, push, GitHub release with the CHANGELOG [Unreleased] notes,
# rotate the changelog), then builds + publishes the image and tarball by
# calling docker-image.yml directly — a release created with GITHUB_TOKEN does
# not fire `release: published`, so nothing would build otherwise (and nothing
# builds twice).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: patch / minor / major, or an explicit version like 1.2.3
        required: true
        default: patch
        type: string
      dry_run:
        description: Only print what would be released (no commit/tag/release/build)
        required: false
        default: false
        type: boolean

concurrency:
  group: release-cut
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ${{ (startsWith(vars.RUNNER_LABELS, '[') && fromJSON(vars.RUNNER_LABELS)) || vars.RUNNER_LABELS || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Validate bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if ! [[ "$BUMP" =~ ^(patch|minor|major|[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::bump must be patch, minor, major or X.Y.Z (got '$BUMP')"
            exit 1
          fi

      - name: Cut release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: ${{ inputs.bump }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$DRY_RUN" = "true" ]; then
            bun release.ts "$BUMP" --dry-run
            exit 0
          fi
          bun release.ts "$BUMP"
          echo "tag=v$(bun -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

  build:
    needs: cut
    if: ${{ !inputs.dry_run && needs.cut.outputs.tag != '' }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      tag: ${{ needs.cut.outputs.tag }}
    secrets: inherit
