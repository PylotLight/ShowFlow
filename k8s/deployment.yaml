apiVersion: v1
kind: Namespace
metadata:
  name: showflow

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: showflow-data
  namespace: showflow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: showflow
  namespace: showflow
  labels:
    app: showflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: showflow
  template:
    metadata:
      labels:
        app: showflow
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: showflow
          image: showflow:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
          volumeMounts:
            - name: data
              mountPath: /data
          # Liveness only confirms the supervisor process itself is up —
          # it answers on :3000 (with a 503) throughout the stop-start
          # handoff between releases, so a TCP check here won't restart the
          # pod during a normal, expected sub-second-to-low-seconds cutover
          # window. An HTTP check against /internal/ready would.
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          # Readiness proxies through to the active release's own DB-backed
          # /internal/ready and gates traffic on it. Expected to fail
          # briefly during Quiescing/Starting — that's k8s correctly pulling
          # the pod out of the Service's endpoints for the handoff window,
          # not a crash.
          readinessProbe:
            httpGet:
              path: /internal/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: showflow-data

---
apiVersion: v1
kind: Service
metadata:
  name: showflow
  namespace: showflow
  labels:
    app: showflow
spec:
  type: ClusterIP
  selector:
    app: showflow
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
