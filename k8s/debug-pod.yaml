# Ephemeral debug pod that mounts the same showflow-data PVC so we can
# read /data/crash.log and inspect showflow.db. Pinned to the app's node
# (luxai) because the PVC is ReadWriteOnce on a local-path provisioner.
# Uses python:3-alpine for sqlite3 because the distroless app image has no
# shell and busybox lacks sqlite3.
apiVersion: v1
kind: Pod
metadata:
  name: showflow-debug
  namespace: showflow
spec:
  nodeName: luxai
  containers:
    - name: debug
      image: python:3-alpine
      command: ["sleep", "infinity"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: showflow-data