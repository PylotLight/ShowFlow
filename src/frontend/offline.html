<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ShowFlow — Applying Update…</title>
<style>
  :root { color-scheme: dark; }
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    margin: 0;
    background: #090a0f;
    color: #f3f4f6;
    text-align: center;
    padding: 1.5rem;
  }
  .card {
    width: 100%;
    max-width: 28rem;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 1rem;
    padding: 2rem;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(12px);
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    padding: 0.25rem 0.75rem;
    border-radius: 9999px;
    background: rgba(56, 189, 248, 0.1);
    border: 1px solid rgba(56, 189, 248, 0.25);
    color: #38bdf8;
    font-size: 0.75rem;
    font-weight: 500;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    margin-bottom: 1.25rem;
  }
  h1 { font-size: 1.35rem; margin: 0 0 0.5rem 0; font-weight: 600; tracking: -0.01em; }
  p { opacity: 0.75; font-size: 0.875rem; line-height: 1.5; margin: 0 0 1.5rem 0; }
  
  .steps {
    display: flex;
    flex-direction: column;
    gap: 0.625rem;
    text-align: left;
    margin-bottom: 1.5rem;
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 0.75rem;
    padding: 0.875rem;
  }
  .step-item {
    display: flex;
    align-items: center;
    gap: 0.625rem;
    font-size: 0.8125rem;
    color: rgba(255, 255, 255, 0.5);
    transition: all 0.2s ease;
  }
  .step-item.active {
    color: #f3f4f6;
    font-weight: 500;
  }
  .step-item.completed {
    color: #34d399;
  }
  .step-icon {
    width: 1.125rem;
    height: 1.125rem;
    border-radius: 9999px;
    border: 1.5px solid currentColor;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.625rem;
    flex-shrink: 0;
  }
  .pulse-dot {
    width: 0.4rem;
    height: 0.4rem;
    border-radius: 999px;
    background: #38bdf8;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.25; transform: scale(0.8); } }
  
  .status-footer {
    font-size: 0.75rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    color: rgba(255, 255, 255, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }
</style>
</head>
<body>
  <div class="card">
    <div className="badge" id="targetBadge">
      <span className="pulse-dot"></span> <span id="targetText">Activating Update</span>
    </div>
    <h1 id="title">Applying App Update</h1>
    <p id="subtext">ShowFlow is activating the new build. The browser will auto-refresh as soon as verification completes.</p>

    <div class="steps">
      <div class="step-item completed" id="step1">
        <div class="step-icon">✓</div>
        <span>1. Download & verify asset</span>
      </div>
      <div class="step-item active" id="step2">
        <div class="step-icon" id="icon2">•</div>
        <span id="label2">2. Stop old app & hand off</span>
      </div>
      <div class="step-item" id="step3">
        <div class="step-icon" id="icon3">•</div>
        <span id="label3">3. Launch new binary</span>
      </div>
      <div class="step-item" id="step4">
        <div class="step-icon" id="icon4">•</div>
        <span id="label4">4. Reconnect & reload page</span>
      </div>
    </div>

    <div class="status-footer" id="status">
      Checking server status...
    </div>
  </div>

  <script>
    (function () {
      var statusEl = document.getElementById('status');
      var targetText = document.getElementById('targetText');
      var step2 = document.getElementById('step2');
      var step3 = document.getElementById('step3');
      var step4 = document.getElementById('step4');
      var icon2 = document.getElementById('icon2');
      var icon3 = document.getElementById('icon3');
      var icon4 = document.getElementById('icon4');

      var attempt = 0;
      var pending = null;
      try {
        pending = localStorage.getItem('showflow:pendingReleaseId');
      } catch (e) {}

      if (pending) {
        targetText.textContent = 'Release: ' + pending.substring(0, 10);
      }

      function backoffDelay(n) {
        var base = Math.min(800 * Math.pow(1.4, n), 4000);
        var jitter = base * (0.2 * Math.random());
        return Math.round(base + jitter);
      }

      function setStepState(stepEl, iconEl, state) {
        if (state === 'completed') {
          stepEl.className = 'step-item completed';
          iconEl.textContent = '✓';
        } else if (state === 'active') {
          stepEl.className = 'step-item active';
          iconEl.textContent = '•';
        } else {
          stepEl.className = 'step-item';
          iconEl.textContent = '•';
        }
      }

      function poll() {
        attempt += 1;
        fetch('/internal/ready', { cache: 'no-store' })
          .then(function (res) {
            if (!res.ok) throw new Error('not ready: ' + res.status);
            return res.json();
          })
          .then(function (body) {
            var releaseId = body && body.releaseId;
            // App process answered HTTP request!
            setStepState(step2, icon2, 'completed');
            setStepState(step3, icon3, 'completed');

            if (!pending || releaseId === pending) {
              setStepState(step4, icon4, 'completed');
              statusEl.textContent = '✓ Update applied! Reloading...';
              try { localStorage.removeItem('showflow:pendingReleaseId'); } catch (e) {}
              setTimeout(function () { window.location.reload(); }, 300);
              return;
            }
            
            // Connected, but release ID mismatch (still switching or rolled back)
            setStepState(step3, icon3, 'active');
            statusEl.textContent = 'Switching process... (attempt ' + attempt + ')';
            setTimeout(poll, backoffDelay(attempt));
          })
          .catch(function () {
            // Still starting/quiescing
            if (attempt > 3) {
              setStepState(step2, icon2, 'completed');
              setStepState(step3, icon3, 'active');
            }
            statusEl.textContent = 'Waiting for server startup... (attempt ' + attempt + ')';
            setTimeout(poll, backoffDelay(attempt));
          });
      }

      setTimeout(poll, backoffDelay(0));
    })();
  </script>
</body>
</html>
